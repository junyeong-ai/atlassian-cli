[package]
name = "atlassian-cli"
version = "0.15.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Atlassian CLI Team"]
description = "High-performance CLI for Atlassian Jira and Confluence"
license = "MIT"
repository = "https://github.com/junyeong-ai/atlassian-cli"
homepage = "https://github.com/junyeong-ai/atlassian-cli"
keywords = ["atlassian", "jira", "confluence", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "atlassian_cli"
path = "src/lib.rs"

[[bin]]
name = "atlassian-cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.13.5", features = ["form", "json", "multipart", "query", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
toml = "1.1.8"
dirs = "7.0.0"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
htmd = "0.5.6"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
regex = "1.13.1"
percent-encoding = "2.3.2"
fastrand = "2.5.0"
httpdate = "1.0.3"
shlex = "2.0.1"

# OAuth 3LO stack
oauth2 = { version = "5.0.0", default-features = false }
webbrowser = "1.2.5"
secrecy = { version = "0.10.3", features = ["serde"] }
tempfile = "3.27.0"
keyring-core = "1.0.1"
async-trait = "0.1.92"

# Self-update stack. Everything the update path needs is in-process: no curl,
# tar or shasum on PATH, so it works wherever the binary itself does.
sha2 = "0.11.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = "0.4.46"
semver = "1.0.28"
self-replace = "1.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
