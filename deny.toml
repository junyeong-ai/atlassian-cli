[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
yanked = "deny"
# Report unmaintained crates anywhere in the graph; cargo-deny 0.22 narrowed the
# default to the workspace's direct dependencies.
unmaintained = "all"
# zvariant and its companions merged into zbus 6. The Linux keyring store,
# zbus-secret-service-keyring-store 1.0.1, still requires secret-service 5 and
# zbus 5; drop these once it moves to secret-service 6, which uses zbus 6.
# chrono is a required dependency of oauth2 5.0.0, the latest release; drop its
# entry once oauth2 no longer depends on it.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; secret-service still requires zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; secret-service still requires zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; secret-service still requires zbus 5" },
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; oauth2 5.0.0 requires it" },
]

[licenses]
confidence-threshold = 0.95
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
deny = [
  { name = "openssl-sys", reason = "TLS goes through rustls (reqwest's rustls feature). Avoid system OpenSSL for portability and compliance." },
  { name = "native-tls",  reason = "Same as above — keep TLS exclusively on rustls." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
