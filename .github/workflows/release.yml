name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_TOOLCHAIN: 1.99.1
  BIN_NAME: atlassian-cli

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-17
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # No build cache here, deliberately. `save-if: false` under a
      # release-only key meant nothing ever populated it, so every restore
      # missed — and restoring anything into the job that produces the
      # published binaries is the cache-poisoning path zizmor flags. A release
      # builds from source, from scratch.
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"           # e.g. v0.2.0
          target="${{ matrix.target }}"
          stem="${BIN_NAME}-${tag}-${target}" # e.g. atlassian-cli-v0.2.0-x86_64-unknown-linux-gnu
          mkdir -p dist staging
          bin="${BIN_NAME}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="${BIN_NAME}.exe"
          fi
          cp "target/${target}/release/${bin}" "staging/${bin}"
          # Every target publishes a .tar.gz so `self update` reads one archive
          # format everywhere; the Windows .zip is published alongside it for
          # downloading by hand.
          tar -C staging -czf "dist/${stem}.tar.gz" "${bin}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd staging && 7z a -bd "../dist/${stem}.zip" "${bin}" >/dev/null)
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          # Run from the asset directory so each checksum records the bare
          # filename; downloads land in a flat directory.
          cd dist
          for asset in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$asset" > "${asset}.sha256"
            else
              shasum -a 256 "$asset" > "${asset}.sha256"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: spdx-json
          artifact-name: ${{ env.BIN_NAME }}-${{ github.ref_name }}.spdx.json
          output-file: artifacts/${{ env.BIN_NAME }}-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Inventory
        run: ls -lh artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
